[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyxtdpthresh"
version = "0.0.1"
description = "Dynamic panel threshold models in Python: ports of Stata's xthenreg and xtdpthresh, validated against Stata"
readme = "README.md"
license = {text = "MIT"}
authors = [{ name = "Frederick Kahindo", email = "frederickahindo048@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "pandas>=2.0",
    "numba>=0.60",
    "matplotlib>=3.7",
]
keywords = ["econometrics", "panel-data", "threshold", "dynamic-panel", "gmm", "xthenreg", "xtdpthresh"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[project.optional-dependencies]
export = ["python-docx>=0.8", "openpyxl>=3.1"]
parallel = ["joblib>=1.3"]
dev = [
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "line_profiler>=4.0",
    "threadpoolctl>=3.2",
    "pre-commit>=3.7",
    "python-docx>=0.8",
    "openpyxl>=3.1",
    "joblib>=1.3",
]

[project.urls]
Homepage = "https://github.com/Kahindo048/pyxtdpthresh"
Repository = "https://github.com/Kahindo048/pyxtdpthresh"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyxtdpthresh = ["py.typed", "extras/datasets/*.csv"]

[tool.setuptools]
license-files = []

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["validation/drafts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "NPY", "PERF", "C90", "D", "ANN"]
ignore = [
    "ANN401",   # Any explicite tol??r?? pour les conteneurs g??n??riques
    "D105",     # docstring des m??thodes magiques
    "D107",     # docstring de __init__ (document?? dans la classe)
    "N803", "N806",   # noms de matrices en majuscules (Z, W, X) comme dans la litt??rature
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "PERF"]
"tools/**" = ["D", "ANN"]
"validation/**" = ["D", "ANN", "E501"]
"examples/**" = ["D", "ANN"]
"**/__init__.py" = ["D104"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.10"
files = ["src/pyxtdpthresh"]
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = false

# couches strictes : core, data, transforms, instruments, inference, models, api
[[tool.mypy.overrides]]
module = [
    "pyxtdpthresh.core.*",
    "pyxtdpthresh.data.*",
    "pyxtdpthresh.transforms.*",
    "pyxtdpthresh.instruments.*",
    "pyxtdpthresh.inference.*",
    "pyxtdpthresh.models.*",
    "pyxtdpthresh.api.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = false
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
strict_equality = true

# biblioth??ques sans stubs complets
[[tool.mypy.overrides]]
module = ["numba.*", "scipy.*", "pandas.*", "docx.*", "openpyxl.*", "joblib.*", "threadpoolctl.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "stata: n??cessite Stata (ex??cution locale seulement)",
    "slow: test long",
    "golden: compare aux r??sultats de r??f??rence fig??s de Stata",
    "bench: benchmark de vitesse",
]
filterwarnings = ["error::DeprecationWarning:pyxtdpthresh.*"]

# ---------------------------------------------------------------- couverture
[tool.coverage.run]
source = ["src/pyxtdpthresh"]
branch = true
omit = ["*/extras/datasets/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_package = "pyxtdpthresh"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Couches : les imports ne vont que vers le bas"
type = "layers"
layers = [
    "pyxtdpthresh.api",
    "pyxtdpthresh.results.public",
    "pyxtdpthresh.extras",
    "pyxtdpthresh.models",
    "pyxtdpthresh.inference",
    "pyxtdpthresh.data : pyxtdpthresh.transforms : pyxtdpthresh.instruments",
    "pyxtdpthresh.core",
    "pyxtdpthresh.kernels",
    "pyxtdpthresh.results.containers : pyxtdpthresh.results.labels : pyxtdpthresh._config : pyxtdpthresh._errors : pyxtdpthresh._i18n : pyxtdpthresh._types",
]

[[tool.importlinter.contracts]]
name = "Numba confin?? ?? kernels"
type = "forbidden"
source_modules = [
    "pyxtdpthresh.core",
    "pyxtdpthresh.data",
    "pyxtdpthresh.transforms",
    "pyxtdpthresh.instruments",
    "pyxtdpthresh.inference",
    "pyxtdpthresh.models",
    "pyxtdpthresh.extras",
    "pyxtdpthresh.api",
    "pyxtdpthresh.results",
]
forbidden_modules = ["numba"]
# only a direct import is forbidden: the layers above use kernels, which use Numba
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Matplotlib, Word et Excel seulement dans extras"
type = "forbidden"
source_modules = [
    "pyxtdpthresh.kernels",
    "pyxtdpthresh.core",
    "pyxtdpthresh.data",
    "pyxtdpthresh.transforms",
    "pyxtdpthresh.instruments",
    "pyxtdpthresh.inference",
    "pyxtdpthresh.models",
    "pyxtdpthresh.api",
    "pyxtdpthresh.results.containers",
    "pyxtdpthresh.results.labels",
]
forbidden_modules = ["matplotlib", "docx", "openpyxl"]
