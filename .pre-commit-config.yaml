# Hooks locaux : ils utilisent les outils de l'environnement actif (pip install -e ".[dev]"),
# sans téléchargement. Activer l'environnement avant `git commit`.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: import-linter
        name: import-linter (couches)
        entry: lint-imports
        language: system
        types: [python]
        pass_filenames: false
